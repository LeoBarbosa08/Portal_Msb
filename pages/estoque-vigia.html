  <script>
  // ================================================================
  // VIGIA DE CONSIGNAÇÃO — coletor + fila de aprovação
  //
  // Esta página NÃO decide nada: ela LÊ o modelo de Estoque com o token MSAL
  // do próprio operador (a mesma fonte validada das outras abas de
  // Consignação) e manda as linhas para /api/consig-vigia-scan, onde mora o
  // motor de regras determinístico (api/shared/consig-regras.js).
  //
  // Por que o navegador e não um cron: as páginas de Estoque consultam o
  // Power BI com token DELEGADO; o Service Principal ainda não foi liberado a
  // executar DAX neste workspace (o /api/pbi-query usa impersonação e dá 502).
  // Quando for, o MESMO endpoint passa a ser chamado pelo GitHub Actions com
  // x-vigia-key e esta página vira só a tela da fila — o motor não muda.
  //
  // FILTROS FIXOS: copiados VERBATIM do visual "Saldo por nota" de
  // estoque-saldo-consignado.html (lista ditada pelo usuário em 20/08/26).
  //   ⚠ NÃO acrescentar aqui o filtro dos 7 códigos de operação: ele ZERA
  //   [Consignado - Saldo de remessas] nesse visual. Fila vazia se leria como
  //   "sem risco", que é o pior modo de falhar deste agente.
  //
  // SÓ REMESSA (usuário, 26/08/26): "considero comodato, queria apenas
  // considerar remessa; todo tipo de operação que começar com S.CON.00 pode
  // incluir, de resto pode desconsiderar" — e, no mesmo dia, "S.LIC.003 e
  // S.LIC.004 devem contar também" (remessa sob contrato licitado). Como o
  // filtro DAX por código zera a medida (acima), a operação vem como COLUNA DE
  // GRUPO e o corte é feito no motor de regras, sobre o resultado — auditável
  // na radiografia "Tipos de operação encontrados". A lista mora no servidor
  // (VIGIA_OPERACOES_INCLUIR), então dá para mexer nela sem deploy. O
  // OPS_PADRAO abaixo é só o texto de fallback da tela quando o resumo do
  // servidor ainda não chegou — quem decide é sempre o motor.
  // ================================================================
  const OPS_PADRAO = 'S.CON.00, S.LIC.003, S.LIC.004';   // espelha CONFIG.operacoesIncluir (só p/ rótulo)
  const PBI_CFG = {
    clientId:'129978ce-ff3b-431d-98b3-66a1bcb766b1', tenantId:'c311c9e6-6017-42a9-b306-4057beba5786',
    workspaceId:'8535f0a1-8dc6-4da0-93ce-bf20c1c14e27',
    scopes:['https://analysis.windows.net/powerbi/api/Dataset.Read.All','https://analysis.windows.net/powerbi/api/Report.Read.All']
  };
  let _pbi=null,_token=null,_dsId=null;
  window.bmDwInfo = () => ({ token:_token, ws:PBI_CFG.workspaceId, ds:_dsId });
  const DS_PINNED   = '960d8415-9844-40aa-a502-07a8b3eea240';
  const DS_CACHE_KEY= 'bio_ds_consignado';
  const FATO = "'Consignação - Remessas'";
  const FATO_VEN = "'Consignação - Vendas e reconsignações'";
  const FATO_DEV = "'Consignação - Devoluções'";

  const DBG    = /[?&]debug\b/i.test(location.search);
  const LIMITE = 20000;   // teto de linhas do saldo mandadas ao motor (truncagem é avisada)
  const TIMEOUT_MS = 150000;   // teto de tempo POR consulta (ver execQuery)

  // ── helpers ──
  const avDax = s => String(s==null?'':s).replace(/"/g,'""');
  const escH  = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const _norm = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const _numN = x => (x==null||x===''||isNaN(Number(x)))?null:Number(x);
  const fBRL = v => v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  function fMi(v){ if(v==null)return '—'; const a=Math.abs(v); if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' Mi'; if(a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k'; return fBRL(v); }
  const fNUM = v => v==null?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2});
  function fDate(v){ if(v==null||v==='') return '—'; const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:String(v); }
  const setTxt=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t;};
  function banner(msg, tipo){ const b=document.getElementById('vg-banner'); if(!b) return; b.className='vg-banner'+(tipo?' '+tipo:''); setTxt('vg-banner-txt', msg); }

  // ── passo da varredura, com cronômetro ──
  // "lendo saldo consignado…" parado na tela é indistinguível de travado. Com os
  // segundos correndo, dá para ver que ainda está vivo (e quanto está custando).
  let _tick=null;
  function passo(txt){
    clearInterval(_tick);
    const t0=Date.now();
    const pinta=()=>setTxt('vg-status', txt+' · '+Math.round((Date.now()-t0)/1000)+'s');
    pinta(); _tick=setInterval(pinta,1000);
  }
  function passoFim(txt){ clearInterval(_tick); _tick=null; setTxt('vg-status', txt||''); }

  // ── DIMENSÕES do grão (cliente × produto × lote) ──
  //    cands copiados de estoque-saldo-consignado.html; o que o modelo não
  //    tiver é PULADO e listado no banner (nunca vira coluna "erro").
  const DIMS = [
    { key:'codcli',   cands:[['Clientes','Cód. do Cliente'],['Clientes','Cód. Cliente'],['Clientes','Cód. do cliente'],['Clientes','Código do cliente']] },
    { key:'cliente',  cands:[['Clientes','Cliente']] },
    { key:'vendedor', cands:[['Vendedores','Vendedor']] },
    { key:'codprod',  cands:[['Produtos','Cód. do produto'],['Produtos','Cód. produto'],['Produtos','Código do produto']] },
    { key:'produto',  cands:[['Produtos','Produto']] },
    { key:'familia',  cands:[['Famílias','Família'],['Produtos','Família']] },
    { key:'lote',     cands:[['Lotes','Lote']] },
    { key:'datavenc', cands:[['Lotes','Data de vencimento (tratada)'],['Lotes','Data de vencimento']] },
    { key:'coddep',   cands:[['Depósitos','Cód. do depósito'],['Depósitos','Cód. depósito'],['Depósitos','Código do depósito']] },
    // ── TIPO DE OPERAÇÃO — é ela que separa REMESSA de COMODATO ──
    // Entra como coluna de GRUPO, não como coluna calculada. A tentativa de
    // 26/08 trouxe a operação com CALCULATE(CONCATENATEX(VALUES(...))) e a
    // consulta nunca voltava; agrupar é o caminho barato e é o que o visual
    // "Saldo por nota" já faz (COLS.idop em estoque-saldo-consignado.html).
    // Efeito colateral: o mesmo lote pode vir em 2+ linhas (uma por operação).
    // Quem soma de volta é o motor de regras — sem isso a fila duplicaria o id.
    { key:'opcod',    cands:[['Operações','Identificador do tipo de operação (D365)'],['Operações','Identificador tipo de operação D365'],['Operações','Identificador do tipo de operação'],['Operações','Cód. tipo de op.']] },
    { key:'oplabel',  cands:[['Operações','Tipo de operação'],['Operações','Tipo de Operação'],['Operações','Operação']] }
  ];
  // dims do giro (grão cliente × produto no fato de vendas/reconsignações)
  const DIMS_VEN = [
    { key:'codcli',  cands:[['Clientes','Cód. do Cliente'],['Clientes','Cód. Cliente']] },
    { key:'codprod', cands:[['Produtos','Cód. do produto'],['Produtos','Cód. produto']] }
  ];
  const DIMS_DEV = DIMS_VEN.concat([{ key:'lote', cands:[['Lotes','Lote']] }]);
  const COL_DATAMOV_VEN = { key:'datamov', cands:[[ 'Consignação - Vendas e reconsignações','Data do movimento' ]] };

  // ── FILTROS FIXOS do visual "Saldo por nota" (verbatim) ──
  const FX = {
    modelo55: { label:'Modelo NF = 55',  op:'in',       vals:['55'],  cands:[['Consignação - Remessas','Nota fiscal (modelo)'],['Consignação - Remessas','Nota fiscal modelo']] },
    nfcheia:  { label:'NF ≠ vazia',      op:'notblank',               cands:[['Consignação - Remessas','Nota fiscal'],['Consignação - Remessas','Nota Fiscal']] },
    statusnf: { label:'Status NF = Aprovado', op:'in',  vals:['Aprovado'], cands:[['Consignação - Remessas','Nota fiscal (status)'],['Consignação - Remessas','Nota fiscal status']] },
    grupodep: { label:'Grupo de depósitos = ESTOQUE CONSIGNADO/COMODATO', op:'in', vals:['ESTOQUE CONSIGNADO/COMODATO'],
                cands:[['Depósitos','Grupo de depósitos'],['Depósitos','Grupo de depósito'],['Depósitos','Grupo depósitos']] },
    exibir:   { label:'Exibir no BI = Sim', op:'in',    vals:['Sim'], cands:[['Consignação - Remessas','Exibir no BI']] }
  };
  const FIX_SALDO = [FX.modelo55, FX.nfcheia, FX.statusnf, FX.grupodep, FX.exibir];
  // Nos fatos de venda e devolução vale só o fixo GLOBAL da Rastreabilidade
  // (grupo de depósitos): é o que aquelas tabelas aplicam.
  const FIX_MOV   = [FX.grupodep];
  const FIXOS_ALL = Object.keys(FX).map(k=>FX[k]);

  // ── MEDIDAS ──
  const MEA = {
    saldo:   { key:'qtde',     cands:['Consignado - Saldo de remessas'] },
    custo:   { key:'custo',    cands:['Consignado - Saldo de remessas (custo)'] },
    aguard:  { key:'aguardfat',cands:['Aguardando faturamento'] },
    venda:   { key:'qtd',      cands:['Quantidade (Venda - reconsignação)','Quantidade (Venda - reconsignacao)','Quantidade (Venda-reconsignação)','Consignado - Quantidade (Venda - reconsignação)'] },
    saldodev:{ key:'saldo',    cands:['Consignado - Saldo de devoluções','Consignado - Saldo de devolucoes'] }
  };
  // ── EXTRAS: colunas do FATO, que não entram no grão ──
  // Uma linha por remessa não serve (o item da fila é o lote), então elas vêm
  // AGREGADAS: MAX dos dias e MIN da data são o MESMO evento — a remessa mais
  // ANTIGA ainda parada naquele cliente × produto × lote.
  //   ⚠ Só MIN/MAX aqui. CONCATENATEX(VALUES(...)) grupo por grupo sobre ~20 mil
  //   linhas é o que pendurou a varredura em 26/08; se um dia precisar de texto
  //   de várias linhas, traga como coluna de GRUPO (como opcod/oplabel).
  const COL_DIASCONS = { key:'diascons', expr:r=>`MAX(${r})`, cands:[['Consignação - Remessas','Dias em consignação']] };
  const COL_DATACONS = { key:'datacons', expr:r=>`MIN(${r})`, texto:true, cands:[['Consignação - Remessas','Data do movimento']] };
  const EXTRAS = [COL_DIASCONS, COL_DATACONS];

  // ── conexão / execução Power BI (MSAL delegado) — mesmo motor das outras abas ──
  async function pbiConnect(){
    if (window._msalAuth){ _pbi = window._msalAuth; }
    else { _pbi = new msal.PublicClientApplication({ auth:{ clientId:PBI_CFG.clientId, authority:`https://login.microsoftonline.com/${PBI_CFG.tenantId}`, redirectUri:window.location.origin+'/' }, cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:true } }); if(_pbi.initialize) await _pbi.initialize(); await _pbi.handleRedirectPromise().catch(()=>{}); }
    const accounts = _pbi.getAllAccounts();
    try { const r = await _pbi.acquireTokenSilent({ scopes:PBI_CFG.scopes, account:accounts[0] }); _token = r.accessToken; }
    catch { const r = await _pbi.loginPopup({ scopes:PBI_CFG.scopes }); _token = r.accessToken; }
    const acc = _pbi.getAllAccounts()[0]; if (acc && typeof window.setSidebarUser==='function') window.setSidebarUser(acc.name||acc.username, acc.username);
  }
  function _pbiErr(text){ try { const j=JSON.parse(text); const e=j.error||{}; const pe=e['pbi.error']||{}; const det=(pe.details||[]).map(d=>d.detail&&d.detail.value).filter(Boolean).join(' | '); return det||e.message||pe.code||text.substring(0,200); } catch { return text.substring(0,200); } }
  async function execQuery(dsId, dax){
    const body=JSON.stringify({queries:[{query:dax}],serializerSettings:{includeNulls:true}});
    // ⚠ O TIMEOUT NÃO É LUXO. Sem AbortController uma consulta LENTA nunca
    // rejeita: o catch nunca roda, a escada de auto-cura nunca desce e a tela
    // fica em "lendo saldo consignado…" para sempre. Foi assim que a versão
    // com CONCATENATEX morreu em 26/08 (revert bcba0f5).
    const ac = new AbortController();
    const kill = setTimeout(()=>ac.abort(), TIMEOUT_MS);
    let r;
    try { r=await PBIModelo.post(PBI_CFG.workspaceId, dsId, {method:'POST',headers:{Authorization:`Bearer ${_token}`,'Content-Type':'application/json'},body,signal:ac.signal}); }
    catch(e){ if(e && e.name==='AbortError') throw new Error('a consulta passou de '+Math.round(TIMEOUT_MS/1000)+'s e foi cancelada'); throw e; }
    finally { clearTimeout(kill); }
    const text=await r.text(); if(!r.ok) throw new Error(`HTTP ${r.status}: ${_pbiErr(text)}`);
    const d=JSON.parse(text); if(d.error) throw new Error(_pbiErr(text));
    return d.results[0].tables[0].rows;
  }
  async function resolveDataset(){
    const falhas = [];
    const cands = [DS_PINNED, localStorage.getItem(DS_CACHE_KEY)].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
    for (const id of cands){ try { await execQuery(id, PBIModelo.sonda(FATO)); localStorage.setItem(DS_CACHE_KEY,id); return (_dsId=id); } catch(e){ falhas.push(['modelo '+id, e]); } }
    const list = await PBIModelo.candidatos(PBI_CFG.workspaceId, _token);
    for (const ds of list){ if (cands.indexOf(ds.id)>=0) continue; try { await execQuery(ds.id, PBIModelo.sonda(FATO)); localStorage.setItem(DS_CACHE_KEY,ds.id); return (_dsId=ds.id); } catch(e){ falhas.push([ds.name, e]); } }
    throw PBIModelo.motivo(FATO, falhas);
  }
  async function pbiQuery(dax){ if(!_dsId) await resolveDataset(); if(DBG) console.log('[VIGIA] DAX >>', dax); return execQuery(_dsId, dax); }

  // ── catálogo do modelo → nomes EXATOS (mesmo resolvedor das outras abas) ──
  let _colCat=null, _meaCat=null, _ignorados=[];
  function _indexCols(rows,tk,nk){ const idx={}; rows.forEach(r=>{ const t=r[tk],n=r[nk]; if(t==null||n==null)return; const tn=_norm(t); (idx[tn]=idx[tn]||{})[_norm(n)]=String(n); }); return idx; }
  function _setRef(c,t,n){ c._t=t; c._n=n; c._ref=`'${t}'[${n}]`; c._out=`${t}[${n}]`; c._include=true; }
  function resolveColSpec(c){
    c._t=c._n=c._ref=c._out=null; c._include=false;
    if(_colCat){
      for(const [t,n] of c.cands){ const tb=_colCat[_norm(t)]; if(tb&&tb[_norm(n)]){ _setRef(c,t,tb[_norm(n)]); break; } }
      if(!c._include){ for(const [t,n] of c.cands){ const tb=_colCat[_norm(t)]; if(!tb)continue; const toks=_norm(n).split(' ').filter(w=>w.length>2); if(!toks.length)continue; let best=null; for(const nn in tb){ if(toks.every(w=>nn.includes(w))){ if(best===null||nn.length<best.length)best=nn; } } if(best!==null){ _setRef(c,t,tb[best]); break; } } }
    } else { const [t,n]=c.cands[0]; _setRef(c,t,n); }
  }
  function resolveM(cands){
    if(_meaCat){
      for(const nm of cands){ const h=_meaCat[_norm(nm)]; if(h)return `[${h}]`; }
      const toks=_norm(cands[0]).split(' ').filter(w=>w.length>2); let best=null;
      for(const nn in _meaCat){ if(toks.length&&toks.every(w=>nn.includes(w))){ if(best===null||nn.length<best.length)best=nn; } }
      if(best!==null)return `[${_meaCat[best]}]`;
    }
    return `[${cands[0]}]`;
  }
  function globalFilterDax(g){
    const ref=g._ref, list=(g.vals||[]).map(v=>'"'+avDax(v)+'"').join(', ');
    if(g.op==='notblank') return `FILTER(ALL(${ref}), NOT(ISBLANK(${ref})) && LEN(TRIM(${ref})) > 0)`;
    return `TREATAS({${list}}, ${ref})`;
  }
  async function carregarCatalogo(){
    try { const rows=await pbiQuery(`EVALUATE SELECTCOLUMNS(INFO.VIEW.COLUMNS(), "T",[Table], "N",[Name])`); if(rows&&rows.length) _colCat=_indexCols(rows,'[T]','[N]'); } catch(e){ console.warn('[VIGIA] INFO.VIEW.COLUMNS:', e.message); }
    if(!_colCat){ try { const rows=await pbiQuery(`EVALUATE SELECTCOLUMNS(COLUMNSTATISTICS(), "T",[Table Name], "N",[Column Name])`); if(rows&&rows.length) _colCat=_indexCols(rows,'[T]','[N]'); } catch(e){ console.warn('[VIGIA] COLUMNSTATISTICS:', e.message); } }
    try { const rows=await pbiQuery(`EVALUATE SELECTCOLUMNS(INFO.VIEW.MEASURES(), "N",[Name])`); if(rows&&rows.length){ _meaCat={}; rows.forEach(r=>{ const n=r['[N]']; if(n!=null)_meaCat[_norm(n)]=String(n); }); } } catch(e){ console.warn('[VIGIA] INFO.VIEW.MEASURES:', e.message); }
    if(!_meaCat){ try { const rows=await pbiQuery(`EVALUATE SELECTCOLUMNS(INFO.MEASURES(), "N",[Name])`); if(rows&&rows.length){ _meaCat={}; rows.forEach(r=>{ const n=r['[N]']; if(n!=null)_meaCat[_norm(n)]=String(n); }); } } catch(e){ console.warn('[VIGIA] INFO.MEASURES:', e.message); } }

    _ignorados=[];
    DIMS.concat(DIMS_VEN, DIMS_DEV, [COL_DATAMOV_VEN], EXTRAS).forEach(c=>{ resolveColSpec(c); });
    DIMS.forEach(c=>{ if(!c._include && _ignorados.indexOf(c.key)<0) _ignorados.push(c.key); });
    FIXOS_ALL.forEach(g=>{
      g._dax=null;
      try { resolveColSpec(g); } catch(e){ console.warn('[VIGIA] filtro fixo', g.label, e.message); }
      if(!g._ref){ console.warn('[VIGIA] filtro fixo sem coluna no modelo:', g.label); return; }
      g._dax = globalFilterDax(g);
    });
    Object.keys(MEA).forEach(k=>{ MEA[k]._ref = resolveM(MEA[k].cands); });

    // ── COLUNA DE GRÃO OBRIGATÓRIA ──
    // Sem cliente, produto ou lote o Vigia não tem o que vigiar: um item sem
    // lote não tem validade, e sem cliente não há a quem cobrar. Falha ALTO —
    // resolvedor silencioso em rotina = alerta errado por semanas sem ninguém
    // notar (foi o risco nº 3 do plano).
    const faltando = ['codcli','codprod','lote'].filter(k => !DIMS.find(d=>d.key===k)._include);
    if(faltando.length) throw new Error('Colunas de grão não encontradas no modelo: '+faltando.join(', ')+'. A varredura seria enganosa e foi abortada.');

    // ── A OPERAÇÃO TAMBÉM É OBRIGATÓRIA ──
    // É ela que separa remessa de comodato. Sem ela a varredura ainda RODARIA,
    // e é justamente esse o problema: a fila voltaria com os equipamentos em
    // comodato no topo, sem nada na tela explicando por quê. Falha alto.
    if(!DIMS.find(d=>d.key==='opcod')._include)
      throw new Error('A coluna do tipo de operação não foi encontrada no modelo (tentei '
        + DIMS.find(d=>d.key==='opcod').cands.map(c=>c[0]+'['+c[1]+']').join(', ')
        + '). É ela que separa remessa de comodato, então a varredura foi abortada em vez de devolver comodato como risco.');
  }

  function chipsFixos(){
    const usados = FIX_SALDO.filter(g=>g._dax).map(g=>g.label);
    const faltas = FIX_SALDO.filter(g=>!g._dax).map(g=>g.label);
    const el = document.getElementById('vg-fix');
    const pref = (_fila.resumo && _fila.resumo.operacoesIncluir) || OPS_PADRAO;
    el.innerHTML = 'Filtros fixos do saldo (iguais ao visual <b>Saldo por nota</b>): <b>'+escH(usados.join(' · '))+'</b>'
      + '<br>Só <b>remessa</b> entra na fila: tipo de operação começando com <b>'+escH(pref)+'</b>'
      + ' (consignação + as duas remessas de licitação) — comodato, venda e faturamento ficam de fora (veja a lista abaixo).'
      + (faltas.length ? ' <span class="w">⚠ não aplicado(s): '+escH(faltas.join(', '))+'</span>' : '')
      + (_ignorados.length ? ' <span class="w">⚠ '+_ignorados.length+' campo(s) fora do modelo (pulados): '+escH(_ignorados.join(', '))+'</span>' : '');
  }

  // ── montagem das consultas ──────────────────────────────────────────────
  const rowKeyMap = row => { const m={}; Object.keys(row||{}).forEach(k=>{ m[_norm(k)]=k; }); return m; };
  function cellVal(r,c,km){ if(c._out in r) return r[c._out]; const k=km[_norm(c._out)]; return k===undefined?null:r[k]; }
  const fixDax = lista => lista.filter(g=>g._dax).map(g=>g._dax);
  function dataDax(dias){ const d=new Date(Date.now()-dias*86400000); return `DATE(${d.getFullYear()}, ${d.getMonth()+1}, ${d.getDate()})`; }

  // tabela colunar {cols, rows} — formato compacto que o motor espera
  function colunar(raw, dims, meas){
    const km = raw.length ? rowKeyMap(raw[0]) : {};
    const cols = dims.filter(d=>d._include).map(d=>d.key).concat(meas.map(m=>m.key));
    // `texto:true` passa o valor cru. Sem isso, uma coluna calculada de DATA
    // ("Consignado em") virava 0 — _numN não converte "2025-05-03" e o ||0
    // transformava a data em zero. Medida de verdade continua caindo em 0.
    const rows = raw.map(r => dims.filter(d=>d._include).map(d=>cellVal(r,d,km))
                                  .concat(meas.map(m=>{
                                    const v = r['['+m.key+']'];
                                    return m.texto ? (v==null?null:String(v)) : (_numN(v)||0);
                                  })));
    return { cols, rows };
  }

  // TOTAL DE CONTROLE: o mesmo recorte SEM nenhuma coluna de grupo — uma linha só.
  // Serve para provar que agrupar por operação não inventou nem perdeu dinheiro
  // (se 'Operações' não estivesse ligada a este fato, o agrupamento viraria
  // produto cartesiano e o saldo lido estouraria o total). Consulta barata.
  async function lerTotal(){
    const flt = fixDax(FIX_SALDO); const fstr = flt.length ? flt.join(', ')+', ' : '';
    const dax = `EVALUATE SUMMARIZECOLUMNS(${fstr}"qtde", ${MEA.saldo._ref}, "custo", ${MEA.custo._ref})`;
    const raw = await pbiQuery(dax);
    if(!raw || !raw.length) return null;
    const km = rowKeyMap(raw[0]);
    const pega = k => { const kk = ('['+k+']' in raw[0]) ? '['+k+']' : km[_norm('['+k+']')]; return kk===undefined?null:_numN(raw[0][kk]); };
    return { qtde: pega('qtde'), custo: pega('custo') };
  }

  async function lerSaldo(){
    const dims = DIMS.filter(d=>d._include);
    const cols = dims.map(d=>d._ref).join(', ');
    const flt  = fixDax(FIX_SALDO); const fstr = flt.length ? flt.join(', ')+', ' : '';
    const base3 = [{key:'qtde'},{key:'custo'},{key:'aguardfat'}];
    const montar = extras => {
      const ex = extras.map(c=>`, "${c.key}", CALCULATE(${c.expr(c._ref)})`).join('');
      const meas = `"qtde", ${MEA.saldo._ref}, "custo", ${MEA.custo._ref}, "aguardfat", ${MEA.aguard._ref}${ex}`;
      const sc   = `SUMMARIZECOLUMNS(${cols}, ${fstr}${meas})`;
      // saldo ≠ 0 é filtro de LINHA do visual de origem (rowFilter da Saldo por Nota).
      // TOPN ordena por ABS do custo: com valor negativo em jogo, ordenar pelo
      // valor não é amostra, é filtro de sinal — comeria justo as negativas.
      return `EVALUATE TOPN(${LIMITE+1}, FILTER(${sc}, ([qtde] > 0 || [qtde] < 0)), ABS([custo]), DESC)`;
    };
    // Auto-cura: se o DAX recusar (ou estourar o tempo de) um extra, tira SÓ ele
    // e tenta de novo. Perder a data de consignação é aceitável; perder a
    // varredura por causa dela, não. Agora funciona de verdade, porque a
    // consulta lenta REJEITA (AbortController no execQuery).
    let extras = EXTRAS.filter(c=>c._include), raw;
    for (let tent=0; ; tent++){
      try { raw = await pbiQuery(montar(extras)); break; }
      catch(e){
        if(!extras.length || tent >= EXTRAS.length) throw e;
        const fora = extras.pop();
        console.warn('[VIGIA] saldo sem "'+fora.key+'":', e.message);
        if(_ignorados.indexOf(fora.key)<0) _ignorados.push(fora.key);
        passo('saldo sem "'+fora.key+'" (a consulta anterior falhou: '+(e.message||e)+')');
      }
    }
    const meaKeys = base3.concat(extras.map(c=>({key:c.key, texto:c.texto})));
    const tabela  = colunar(raw.slice(0,LIMITE), dims, meaKeys);
    const iCusto  = tabela.cols.indexOf('custo');
    const lido    = iCusto<0 ? null : tabela.rows.reduce((a,r)=>a+(Number(r[iCusto])||0),0);
    return { tabela, truncado: raw.length > LIMITE, custoLido: lido };
  }

  async function lerGiro(dias){
    if(!COL_DATAMOV_VEN._include) return { cols:['codcli','codprod','qtd'], rows:[] };
    const dims = DIMS_VEN.filter(d=>d._include);
    const cols = dims.map(d=>d._ref).join(', ');
    const flt  = fixDax(FIX_MOV).concat([`FILTER(ALL(${COL_DATAMOV_VEN._ref}), ${COL_DATAMOV_VEN._ref} >= ${dataDax(dias)})`]);
    const dax  = `EVALUATE SUMMARIZECOLUMNS(${cols}, ${flt.join(', ')}, "qtd", ${MEA.venda._ref})`;
    const raw  = await pbiQuery(dax);
    return colunar(raw, dims, [{key:'qtd'}]);
  }

  async function lerDevolucoes(){
    const dims = DIMS_DEV.filter(d=>d._include);
    const cols = dims.map(d=>d._ref).join(', ');
    const flt  = fixDax(FIX_MOV); const fstr = flt.length ? flt.join(', ')+', ' : '';
    const dax  = `EVALUATE FILTER(SUMMARIZECOLUMNS(${cols}, ${fstr}"saldo", ${MEA.saldodev._ref}), ([saldo] > 0 || [saldo] < 0))`;
    const raw  = await pbiQuery(dax);
    return colunar(raw, dims, [{key:'saldo'}]);
  }

  // ── varredura completa ──────────────────────────────────────────────────
  let _fila = { itens:[], resumo:null, atualizadoEm:null, configured:false };

  async function varrer(){
    const btn=document.getElementById('vg-run'); btn.disabled=true;
    try {
      passo('conferindo o total do recorte…');
      let total = null;
      try { total = await lerTotal(); }
      catch(e){ console.warn('[VIGIA] total de controle:', e.message); }

      passo('lendo saldo consignado (por cliente, produto, lote e operação)…');
      const saldo = await lerSaldo();
      passo(`saldo: ${saldo.tabela.rows.length} linhas · lendo giro de 90 dias…`);
      const g90 = await lerGiro(90);
      passo('lendo giro de 180 dias…');
      const g180 = await lerGiro(180);
      passo('lendo devoluções em curso…');
      let devol = { cols:['codcli','codprod','lote','saldo'], rows:[] };
      try { devol = await lerDevolucoes(); }
      catch(e){ console.warn('[VIGIA] devoluções:', e.message); _ignorados.push('devoluções em curso'); }

      passo('classificando…');
      // ── GIRO VAZIO É ARMADILHA ──
      // Se a consulta de consumo voltar sem linha nenhuma, TODO item de validade
      // longa cai em "Parado" e a fila inteira vira falso positivo com cara de
      // descoberta. Isso tem que gritar, não passar batido.
      const giroVazio = !g180.rows.length;
      if(giroVazio) _ignorados.push('GIRO VAZIO: nenhuma venda/reconsignação em 180 dias');

      // o total de controle x o que foi lido: prova que agrupar por operação não
      // duplicou (produto cartesiano) nem perdeu saldo pelo caminho
      const controle = (total && total.custo!=null && saldo.custoLido!=null && !saldo.truncado) ? {
        custoTotal: Math.round(total.custo), custoLido: Math.round(saldo.custoLido),
        diverge: Math.abs(total.custo - saldo.custoLido) > Math.max(1, Math.abs(total.custo)) * 0.005
      } : null;

      const dados = {
        gerado: new Date().toISOString(),
        saldo: saldo.tabela, giro90:g90, giro180:g180, devol,
        meta: { truncado: saldo.truncado, camposIgnorados:_ignorados.slice(), limite:LIMITE, controle,
                giro90Linhas:g90.rows.length, giro180Linhas:g180.rows.length, devolLinhas:devol.rows.length, giroVazio }
      };
      if(DBG) console.log('[VIGIA] payload', dados);

      const r = await fetch('/api/consig-vigia-scan', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ dados })
      });
      const j = await r.json().catch(()=>({}));
      if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));

      _fila = { itens:j.itens||[], resumo:j.resumo||null, atualizadoEm:j.atualizadoEm, configured:!!j.configured, blobErro:j.blobErro||null };
      render();
      if(window.bmVigiaBadge) window.bmVigiaBadge(true);
      const res = j.resumo || {};
      // ── a ordem do banner é a ordem da gravidade ──
      // Um erro de leitura do recorte vem ANTES de "deu tudo certo": fila vazia
      // (ou inflada) com banner verde é o modo de falhar mais caro deste agente.
      if(res.alertaOperacaoZerou)
        banner(`NENHUMA linha passou pelo filtro de operação (${res.operacoesIncluir}) — a fila está vazia por ISSO, não por falta de risco. Confira os tipos de operação encontrados logo abaixo.`,'err');
      else if(res.controle && res.controle.diverge)
        banner(`O saldo lido (${fMi(res.controle.custoLido)}) não fecha com o total do recorte (${fMi(res.controle.custoTotal)}). Agrupar por operação pode ter duplicado linhas — trate os números como suspeitos.`,'err');
      else if(res.alertaSemFiltroOperacao)
        banner('Sem prefixo de operação configurado (VIGIA_OPERACOES_INCLUIR vazio): o comodato VOLTOU para a fila.','warn');
      else if(j.blobErro) banner(`Varredura pronta, mas NÃO foi salva — o storage respondeu ${j.blobErro.status}. ${j.blobErro.dica}`,'err');
      else if(!j.configured) banner('Varredura pronta — mas a persistência está DESLIGADA. Configure VIGIA_BLOB_URL na SWA para as decisões sobreviverem ao reload.','warn');
      else banner(`Varredura concluída às ${new Date(j.atualizadoEm).toLocaleTimeString('pt-BR')} · ${res.candidatos} item(ns) de risco em ${res.linhasLidas} linhas lidas`
        + (res.fora && res.fora.itens ? ` (${res.fora.itens} linha(ns) fora por operação, ${fMi(res.fora.custo)}).` : '.'),'ok');
      passoFim();
    } catch(e){
      console.error('[VIGIA]', e);
      banner('Falha na varredura: '+(e.message||e),'err');
      passoFim();
    } finally { btn.disabled=false; }
  }

  async function carregarFila(){
    try {
      const r = await fetch('/api/consig-vigia-fila');
      const j = await r.json().catch(()=>({}));
      if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
      _fila = { itens:j.itens||[], resumo:j.resumo||null, atualizadoEm:j.atualizadoEm, configured:!!j.configured, blobErro:j.blobErro||null };
      render();
      return j;
    } catch(e){ console.warn('[VIGIA] fila:', e.message); return null; }
  }

  async function decidir(id, status){
    let motivo = null;
    if(status==='descartado'){
      motivo = prompt('Por que descartar? (ex.: reservado para cirurgia agendada)');
      if(motivo===null) return;   // cancelou
    }
    const el = document.querySelector(`tr[data-id="${id}"]`); if(el) el.style.opacity='.45';
    try {
      const r = await fetch('/api/consig-vigia-fila', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, status, motivo }) });
      const j = await r.json().catch(()=>({}));
      if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
      const i = _fila.itens.findIndex(x=>x.id===id);
      if(i>=0) _fila.itens[i] = j.item;
      render();
      if(window.bmVigiaBadge) window.bmVigiaBadge(true);   // o contador do menu segue a decisão
    } catch(e){
      if(el) el.style.opacity='1';
      banner('Não foi possível registrar a decisão: '+(e.message||e),'err');
    }
  }
  window.vgDecidir = decidir;

  // ── render ──────────────────────────────────────────────────────────────
  const CLASSES = {
    vencido:'Vencido no cliente', vencer_sem_giro:'Vence sem giro', vencer_com_giro:'Vence com giro',
    parado:'Parado', excesso:'Excesso'
  };
  const COLUNAS = [
    { k:'score',      h:'Prioridade', num:true,  f:i=>fMi(i.score) },
    { k:'classe',     h:'Classe',                f:i=>`<span class="vg-tag t-${i.classe}">${escH(i.rotulo||CLASSES[i.classe]||i.classe)}</span>` },
    { k:'cliente',    h:'Cliente',               f:i=>`<b>${escH(i.cliente||i.codcli)}</b><div style="font-size:11px;color:#97A8AE;">${escH(i.codcli)}${i.vendedor?' · '+escH(i.vendedor):''}</div>` },
    { k:'produto',    h:'Produto',               f:i=>`${escH(i.produto||i.codprod)}<div style="font-size:11px;color:#97A8AE;">${escH(i.codprod)}${i.familia?' · '+escH(i.familia):''}</div>` },
    { k:'lote',       h:'Lote',                  f:i=>escH(i.lote||'—')
        + (i.operacao?`<div style="font-size:10.5px;color:#97A8AE;max-width:150px;">${escH(i.operacao)}</div>`:'')
        + (i.idOperacao?`<div style="font-size:10px;color:#B9C4C9;">${escH(i.idOperacao)}</div>`:'') },
    // Consignado em / Dias consig. vêm da remessa mais ANTIGA ainda parada
    // naquele cliente × produto × lote (MIN da data, MAX dos dias).
    { k:'datacons',   h:'Consignado em',
      t:'Data da remessa mais antiga desse lote ainda parada no cliente.',
      f:i=>fDate(i.dataConsignacao) },
    { k:'diascons',   h:'Dias no cliente', num:true,
      t:'Dias em consignação da remessa mais antiga desse lote. Âmbar acima de 180 dias, vermelho acima de 365.',
      f:i=>i.diasEmConsignacao==null?'—':`<b style="color:${i.diasEmConsignacao>=365?'#B91C1C':(i.diasEmConsignacao>=180?'#B45309':'#374951')};">${fNUM(i.diasEmConsignacao)}</b>` },
    { k:'datavenc',   h:'Vence',                 f:i=>fDate(i.datavenc)+(i.diasParaVencer!=null?`<div style="font-size:11px;color:${i.diasParaVencer<0?'#B91C1C':'#97A8AE'};">${i.diasParaVencer<0?Math.abs(i.diasParaVencer)+'d vencido':i.diasParaVencer+'d'}</div>`:'') },
    { k:'qtde',       h:'Saldo',      num:true,  f:i=>fNUM(i.qtde) },
    { k:'custo',      h:'R$ saldo',   num:true,  f:i=>fBRL(i.custo) },
    { k:'custoEmRisco',h:'R$ em risco',num:true, f:i=>`<b style="color:#10323E;">${fBRL(i.custoEmRisco)}</b>` },
    { k:'consumo90',  h:'Consumo 90/180d', num:true, f:i=>`${fNUM(i.consumo90)} / ${fNUM(i.consumo180)}` },
    { k:'porque',     h:'Por quê',               f:i=>`<div class="vg-porque">${escH(i.porque)}</div><div style="font-size:11px;color:#374951;margin-top:3px;"><b>→ ${escH(i.acao)}</b></div>` },
    { k:'status',     h:'Status',                f:i=>`<span class="vg-tag s-${i.status}">${escH(i.status)}</span>`
        + (i.reincidencias?`<div style="font-size:10.5px;color:#B45309;margin-top:3px;">reincidiu ${i.reincidencias}x</div>`:'')
        + (i.motivo?`<div style="font-size:10.5px;color:#97A8AE;margin-top:3px;">${escH(i.motivo)}</div>`:'') },
    { k:'acoes',      h:'',                      f:i=>acoesDe(i) }
  ];
  function acoesDe(i){
    const b=[];
    if(i.status!=='aprovado')   b.push(`<button class="ap" onclick="vgDecidir('${i.id}','aprovado')">Aprovar</button>`);
    if(i.status==='aprovado')   b.push(`<button class="ex" onclick="vgDecidir('${i.id}','executado')">Executado</button>`);
    if(i.status!=='descartado') b.push(`<button class="de" onclick="vgDecidir('${i.id}','descartado')">Descartar</button>`);
    if(i.status!=='pendente')   b.push(`<button onclick="vgDecidir('${i.id}','pendente')">Reabrir</button>`);
    return `<div class="vg-acoes">${b.join('')}</div>`;
  }

  function filtrados(){
    const st = document.getElementById('vg-f-status').value;
    const cl = document.getElementById('vg-f-classe').value;
    const q  = _norm(document.getElementById('vg-busca').value);
    return _fila.itens.filter(i=>{
      if(st && i.status!==st) return false;
      if(cl && i.classe!==cl) return false;
      if(q && !_norm([i.cliente,i.codcli,i.produto,i.codprod,i.lote,i.vendedor,i.familia].join(' ')).includes(q)) return false;
      return true;
    });
  }

  function render(){
    // KPIs — R$ EM RISCO por classe (não o saldo inteiro: a prioridade é a
    // parcela que não deve girar a tempo)
    const res = _fila.resumo || {};
    const pc  = res.porClasse || {};
    const kp = [`<div class="vg-kpi total"><div class="l">R$ em risco</div><div class="v">${fMi(res.custoEmRisco)}</div><div class="s">${res.candidatos||0} item(ns) · saldo de ${fMi(res.custoSaldo)}</div></div>`];
    Object.keys(CLASSES).forEach(c=>{
      const d = pc[c] || { itens:0, custoEmRisco:0 };
      kp.push(`<div class="vg-kpi c-${c}"><div class="l">${escH(CLASSES[c])}</div><div class="v">${fMi(d.custoEmRisco)}</div><div class="s">${d.itens} item(ns)</div></div>`);
    });
    document.getElementById('vg-kpis').innerHTML = kp.join('');

    // ── radiografia das operações do recorte (o que entrou e o que ficou fora) ──
    const ops = res.operacoes || [];
    const box = document.getElementById('vg-ops-box');
    if(box){
      box.style.display = ops.length ? '' : 'none';
      const dentro = ops.filter(o=>o.incluida).length;
      setTxt('vg-ops-cnt', ops.length
        ? `· ${ops.length} operação(ões) no recorte · ${dentro} na fila (só as que começam com ${res.operacoesIncluir||OPS_PADRAO})`
        : '');
      document.getElementById('vg-ops').innerHTML =
        '<thead><tr><th>Tipo de operação</th><th>ID (D365)</th><th style="text-align:right">Linhas</th><th style="text-align:right">R$ saldo</th><th>Na fila?</th></tr></thead><tbody>'
        + ops.map(o=>`<tr><td>${escH(o.operacao)}</td><td style="color:#97A8AE;">${escH(o.idop||'—')}</td><td class="num">${fNUM(o.itens)}</td><td class="num">${fBRL(o.custo)}</td>`
            + `<td>${o.incluida?'<span class="vg-tag s-pendente">sim — remessa</span>'
                              :(o.comodato?'<span class="vg-tag s-descartado">fora — comodato</span>'
                                          :'<span class="vg-tag s-descartado">fora — outra operação</span>')}</td></tr>`).join('')
        + '</tbody>';
    }

    // seletor de classe
    const sel = document.getElementById('vg-f-classe');
    if(sel.options.length<=1){
      Object.keys(CLASSES).forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=CLASSES[c]; sel.appendChild(o); });
    }

    // tabela
    document.getElementById('vg-head').innerHTML = '<tr>'+COLUNAS.map(c=>
      `<th${c.t?` title="${escH(c.t)}" style="${c.num?'text-align:right;':''}cursor:help;border-bottom:2px dotted #CAD4D8;"`:(c.num?' style="text-align:right"':'')}>${escH(c.h)}</th>`).join('')+'</tr>';
    const its = filtrados();
    document.getElementById('vg-rows').innerHTML = its.length
      ? its.map(i=>`<tr data-id="${i.id}">`+COLUNAS.map(c=>`<td${c.num?' class="num"':''}>${c.f(i)}</td>`).join('')+'</tr>').join('')
      : `<tr><td colspan="${COLUNAS.length}"><div class="vg-empty">Nada nesta visão. Rode uma varredura ou troque o filtro de status.</div></td></tr>`;

    // legenda honesta: teto, truncagem e campos pulados aparecem SEMPRE
    const av = [];
    av.push(`${its.length} de ${_fila.itens.length} na fila`);
    if(_fila.atualizadoEm) av.push('varredura de '+new Date(_fila.atualizadoEm).toLocaleString('pt-BR'));
    if(res.enfileirados!=null) av.push(`top ${res.teto} por R$ em risco`);
    if(res.cortadosPorTeto)  av.push(`⚠ ${res.cortadosPorTeto} candidato(s) ficaram fora do teto`);
    if(res.fonteTruncada)    av.push(`⚠ a leitura do saldo bateu no limite de ${LIMITE} linhas`);
    if(res.ignoradosDevolucao) av.push(`${res.ignoradosDevolucao} lote(s) fora por devolução em curso`);
    // o que a whitelist da operação barrou — dito em voz alta, sempre
    if(res.fora && res.fora.itens){
      const com = res.comodato && res.comodato.itens
        ? `, ${res.comodato.itens} de comodato (${fMi(res.comodato.custo)})` : '';
      av.push(`${res.fora.itens} linha(s) fora por operação — ${fMi(res.fora.custo)}${com}`);
    }
    if(res.alertaOperacaoZerou)      av.push('⚠ NENHUMA linha passou pelo filtro de operação');
    if(res.alertaSemFiltroOperacao)  av.push('⚠ sem filtro de operação: o comodato está na fila');
    if(res.controle && res.controle.diverge)
      av.push(`⚠ saldo lido ${fMi(res.controle.custoLido)} ≠ total do recorte ${fMi(res.controle.custoTotal)}`);
    if(res.giro180Linhas!=null) av.push(res.giro180Linhas
      ? `giro: ${res.giro90Linhas}/${res.giro180Linhas} pares cliente×produto (90/180d)`
      : '⚠ GIRO VAZIO — sem venda/reconsignação em 180d, então TUDO virou "Parado"');
    if(_fila.blobErro)       av.push(`⚠ storage respondeu ${_fila.blobErro.status} — nada está sendo salvo`);
    else if(!_fila.configured) av.push('⚠ sem persistência (VIGIA_BLOB_URL)');
    setTxt('vg-info', av.join(' · '));
    // o prefixo de operação é do SERVIDOR (env): depois da 1ª varredura a linha
    // dos filtros fixos passa a mostrar o que ele realmente usou
    if(FIX_SALDO.some(g=>g._dax)) chipsFixos();
    document.getElementById('vg-csv').disabled = !_fila.itens.length;
  }

  // inspeção no console (mesmo hábito do window._avSel das outras abas):
  //   _vg.fila           -> o que está na tela
  //   _vg.fila = {...}; _vg.render()   -> renderiza sem Power BI (teste de layout)
  window._vg = { get fila(){ return _fila; }, set fila(v){ _fila = v; }, render:()=>render(), varrer, carregarFila };

  function exportarCSV(){
    const its = filtrados();
    if(!its.length) return;
    const cab = ['Prioridade','Urgencia','Classe','Status','Cod. Cliente','Cliente','Vendedor','Cod. Produto','Produto','Familia','Lote','Tipo de operacao','ID operacao (D365)','Deposito','Consignado em','Dias no cliente','Vencimento','Dias p/ vencer','Saldo (qtde)','R$ saldo','Qtde em risco','R$ em risco','Consumo 90d','Consumo 180d','Cobertura (meses)','Por que','Acao','Motivo do descarte'];
    const linha = i => [i.score,i.urgencia,i.rotulo,i.status,i.codcli,i.cliente,i.vendedor,i.codprod,i.produto,i.familia,i.lote,i.operacao,i.idOperacao,i.coddep,i.dataConsignacao,i.diasEmConsignacao,i.datavenc,i.diasParaVencer,i.qtde,i.custo,i.qtdeEmRisco,i.custoEmRisco,i.consumo90,i.consumo180,i.coberturaMeses,i.porque,i.acao,i.motivo]
      .map(v=>{ const s=(v==null?'':String(v)); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(';');
    const csv = '﻿'+[cab.join(';')].concat(its.map(linha)).join('\r\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='vigia-consignacao-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click(); URL.revokeObjectURL(a.href);
  }

  // ── boot ────────────────────────────────────────────────────────────────
  (async function boot(){
    document.getElementById('vg-run').onclick    = varrer;
    document.getElementById('vg-reload').onclick = ()=>carregarFila();
    document.getElementById('vg-csv').onclick    = exportarCSV;
    ['vg-f-status','vg-f-classe'].forEach(id=>{ document.getElementById(id).onchange = render; });
    let t=null; document.getElementById('vg-busca').oninput = ()=>{ clearTimeout(t); t=setTimeout(render,220); };

    // a fila não depende do Power BI: mostra o que já foi decidido antes mesmo de conectar
    const f = await carregarFila();
    if(f && f.blobErro) banner(`O storage respondeu ${f.blobErro.status} — a fila não está sendo salva. ${f.blobErro.dica}`,'err');
    else if(f && !f.configured) banner('Fila em memória: falta configurar VIGIA_BLOB_URL na SWA para as decisões persistirem.','warn');

    try {
      banner('Conectando ao Power BI…');
      await pbiConnect();
      await resolveDataset();
      banner('Lendo o catálogo do modelo…');
      await carregarCatalogo();
      chipsFixos();
      document.getElementById('vg-run').disabled = false;
      document.getElementById('vg-reload').disabled = false;
      if(!f || !(f.itens||[]).length) banner('Pronto. Clique em "Rodar varredura" para montar a fila do dia.','ok');
      else banner('Pronto. Fila carregada — rode uma varredura para atualizar os números.','ok');
      render();
    } catch(e){
      console.error('[VIGIA]', e);
      banner('Não foi possível preparar a varredura: '+(e.message||e),'err');
      document.getElementById('vg-fix').textContent = 'Filtros fixos: não foi possível ler o modelo.';
    }
  })();
  </script>
</body>
