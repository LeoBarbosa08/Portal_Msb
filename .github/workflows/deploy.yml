name: Deploy · Portal Comercial & Estoque

# Publica na Static Web App deste portal a cada push na master.
# Segredo: AZURE_STATIC_WEB_APPS_API_TOKEN (token de deploy da Static Web App,
# em Azure › Static Web App › Manage deployment token).
# Enquanto o segredo não existir, o job só avisa e termina sem erro — o
# repositório pode receber push antes de a Static Web App ser criada.
# Sem ambiente de pull request de propósito: cada PR abriria um site de
# prévia e gastaria minutos do Actions (a franquia é a mesma do portal
# corporativo).
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Sem token de deploy ainda
        if: env.SWA_TOKEN == ''
        run: echo "::warning::Segredo AZURE_STATIC_WEB_APPS_API_TOKEN ainda não cadastrado — nada foi publicado. Veja o README (Como colocar no ar, passo 2)."
      - uses: actions/checkout@v3
        if: env.SWA_TOKEN != ''
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        if: env.SWA_TOKEN != ''
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: "upload"
          app_location: "/"      # site estatico (HTML puro)
          api_location: "api"    # Azure Functions
          output_location: "/"
          skip_app_build: true   # site estatico - nao precisa de build
          skip_api_build: true   # Functions sem dependencias npm (evita "Docker build failed")
